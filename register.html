<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Hospital Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card auth-card-wide">
      <div class="auth-header">
        <div class="auth-logo">🏥</div>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Register to access the hospital services</p>
      </div>

      <!-- Registration Tabs -->
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabBtnPatient" onclick="switchTab('patient')">
          Patient Registration
        </button>
        <button type="button" class="tab-btn" id="tabBtnDoctor" onclick="switchTab('doctor')">
          Doctor Registration
        </button>
      </div>

      <!-- Alert Message Box -->
      <div id="alertBox"></div>

      <!-- Tab 1: Patient Registration Form -->
      <div id="patientPane" class="tab-pane active">
        <form id="patientForm" onsubmit="handlePatientRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pUsername">Username <span class="required">*</span></label>
              <input type="text" id="pUsername" class="form-control" required autocomplete="username">
            </div>
            <div class="form-group">
              <label class="form-label" for="pPassword">Password <span class="required">* (min 8 chars)</span></label>
              <input type="password" id="pPassword" class="form-control" minlength="8" required autocomplete="new-password">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pName">Full Name <span class="required">*</span></label>
              <input type="text" id="pName" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="pGender">Gender <span class="required">*</span></label>
              <select id="pGender" class="form-control" required>
                <option value="">Select Gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pDob">Date of Birth <span class="required">*</span></label>
              <input type="date" id="pDob" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="pPhone">Phone Number</label>
              <input type="tel" id="pPhone" class="form-control" placeholder="Optional">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="pBloodGroup">Blood Group</label>
              <select id="pBloodGroup" class="form-control">
                <option value="Unknown">Select Blood Group (Optional)</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="Unknown">Unknown</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="pAddress">Address</label>
            <textarea id="pAddress" class="form-control" placeholder="Residential address (Optional)" rows="2"></textarea>
          </div>

          <div class="form-group" style="margin-top: 1.25rem;">
            <button type="submit" id="pSubmitBtn" class="btn btn-primary btn-block">
              Register as Patient
            </button>
          </div>
        </form>
      </div>

      <!-- Tab 2: Doctor Registration Form -->
      <div id="doctorPane" class="tab-pane">
        <div class="alert alert-info" style="margin-bottom: 1rem;">
          Doctor accounts require administrator approval before logging in.
        </div>

        <form id="doctorForm" onsubmit="handleDoctorRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="dUsername">Username <span class="required">*</span></label>
              <input type="text" id="dUsername" class="form-control" required autocomplete="username">
            </div>
            <div class="form-group">
              <label class="form-label" for="dPassword">Password <span class="required">* (min 8 chars)</span></label>
              <input type="password" id="dPassword" class="form-control" minlength="8" required autocomplete="new-password">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="dName">Full Name <span class="required">*</span></label>
              <input type="text" id="dName" class="form-control" placeholder="Dr. First Last" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="dSpecialization">Specialization <span class="required">*</span></label>
              <input type="text" id="dSpecialization" class="form-control" placeholder="e.g. Cardiologist" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="dEmail">Email Address <span class="required">*</span></label>
              <input type="email" id="dEmail" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="dDepartment">Department <span class="required">*</span></label>
              <select id="dDepartment" class="form-control" required>
                <option value="">Loading departments...</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="dPhone">Phone Number</label>
              <input type="tel" id="dPhone" class="form-control" placeholder="Optional">
            </div>
            <div class="form-group">
              <label class="form-label" for="dConsultationFee">Consultation Fee (₹)</label>
              <input type="number" id="dConsultationFee" class="form-control" value="500" min="0" step="50">
            </div>
          </div>

          <div class="form-group" style="margin-top: 1.25rem;">
            <button type="submit" id="dSubmitBtn" class="btn btn-primary btn-block">
              Register as Doctor
            </button>
          </div>
        </form>
      </div>

      <div style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--secondary);">
        Already have an account? <a href="index.html">Log in here</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Tab switching logic
    function switchTab(role) {
      clearMessage('alertBox');
      const isPatient = role === 'patient';
      document.getElementById('tabBtnPatient').classList.toggle('active', isPatient);
      document.getElementById('tabBtnDoctor').classList.toggle('active', !isPatient);
      document.getElementById('patientPane').classList.toggle('active', isPatient);
      document.getElementById('doctorPane').classList.toggle('active', !isPatient);
    }

    // Load department list on page load
    window.addEventListener('DOMContentLoaded', async () => {
      loadDepartments();
    });

    async function loadDepartments() {
      const select = document.getElementById('dDepartment');
      try {
        const depts = await apiFetch('/api/departments');
        if (Array.isArray(depts) && depts.length > 0) {
          select.innerHTML = '<option value="">Select Department</option>' +
            depts.map(d => `<option value="${d.DeptID}">${escapeHtml(d.DeptName)} (${escapeHtml(d.Location || '')})</option>`).join('');
        } else {
          select.innerHTML = '<option value="">No departments available</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">Failed to load departments</option>';
      }
    }

    // Handle Patient Registration
    async function handlePatientRegister(e) {
      e.preventDefault();
      clearMessage('alertBox');

      const submitBtn = document.getElementById('pSubmitBtn');
      const username = document.getElementById('pUsername').value.trim();
      const password = document.getElementById('pPassword').value;
      const name = document.getElementById('pName').value.trim();
      const gender = document.getElementById('pGender').value;
      const dob = document.getElementById('pDob').value;
      const phone = document.getElementById('pPhone').value.trim() || null;
      const address = document.getElementById('pAddress').value.trim() || null;
      const bloodGroup = document.getElementById('pBloodGroup').value;

      if (password.length < 8) {
        showMessage('alertBox', 'error', 'Password must be at least 8 characters long.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const payload = {
          Username: username,
          Password: password,
          Name: name,
          Gender: gender,
          DOB: dob,
          Phone: phone,
          Address: address,
          BloodGroup: bloodGroup !== 'Unknown' ? bloodGroup : null
        };

        const sessionData = await apiFetch('/api/auth/register/patient', {
          method: 'POST',
          body: payload
        });

        // Patient registration automatically logs the patient in
        saveSession(sessionData);
        showMessage('alertBox', 'success', 'Registration successful! Redirecting to patient portal...');
        setTimeout(() => {
          redirectByRole('Patient');
        }, 800);
      } catch (err) {
        showMessage('alertBox', 'error', err.message || 'Registration failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register as Patient';
      }
    }

    // Handle Doctor Registration
    async function handleDoctorRegister(e) {
      e.preventDefault();
      clearMessage('alertBox');

      const submitBtn = document.getElementById('dSubmitBtn');
      const username = document.getElementById('dUsername').value.trim();
      const password = document.getElementById('dPassword').value;
      const name = document.getElementById('dName').value.trim();
      const specialization = document.getElementById('dSpecialization').value.trim();
      const email = document.getElementById('dEmail').value.trim();
      const deptId = document.getElementById('dDepartment').value;
      const phone = document.getElementById('dPhone').value.trim() || null;
      const fee = document.getElementById('dConsultationFee').value || 500;

      if (password.length < 8) {
        showMessage('alertBox', 'error', 'Password must be at least 8 characters long.');
        return;
      }

      if (!deptId) {
        showMessage('alertBox', 'error', 'Please select a department.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const payload = {
          Username: username,
          Password: password,
          Name: name,
          Specialization: specialization,
          Email: email,
          DeptID: parseInt(deptId, 10),
          Phone: phone,
          ConsultationFee: parseFloat(fee)
        };

        const res = await apiFetch('/api/auth/register/doctor', {
          method: 'POST',
          body: payload
        });

        document.getElementById('doctorForm').reset();
        showMessage(
          'alertBox',
          'success',
          res.message || 'Registration submitted! Your account is waiting for administrator approval before you can log in.'
        );
      } catch (err) {
        showMessage('alertBox', 'error', err.message || 'Doctor registration failed.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register as Doctor';
      }
    }
  </script>
</body>
</html>
