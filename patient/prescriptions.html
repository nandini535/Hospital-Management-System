<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Prescriptions - Patient Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <div id="navbar"></div>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">My Prescriptions</h1>
        <p class="page-subtitle">Medications and clinical notes prescribed by your doctors</p>
      </div>
      <div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="loadPrescriptions()">
          🔄 Refresh
        </button>
      </div>
    </div>

    <!-- Alert Box -->
    <div id="alertBox"></div>

    <!-- Prescriptions List Container -->
    <div id="prescriptionsContainer">
      <p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">Loading prescriptions...</p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth('Patient')) return;
      renderNavbar('prescriptions');
      await loadPrescriptions();
    });

    async function loadPrescriptions() {
      clearMessage('alertBox');
      const container = document.getElementById('prescriptionsContainer');
      container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">Loading prescriptions...</p>';

      try {
        const list = await apiFetch('/api/patient/prescriptions');
        if (!Array.isArray(list) || list.length === 0) {
          container.innerHTML = `
            <div class="card">
              <div class="card-body" style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">
                <div style="font-size: 2rem; margin-bottom: 0.5rem;">💊</div>
                <p>No prescriptions have been issued to you yet.</p>
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = list.map(rx => {
          const items = rx.items || [];
          const itemsTableHtml = items.length > 0
            ? `
              <div class="table-responsive" style="margin-top: 0.75rem;">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Medicine Name</th>
                      <th>Dosage / Instructions</th>
                      <th style="width: 120px;">Quantity</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${items.map(it => `
                      <tr>
                        <td><strong>${escapeHtml(it.Medicine)}</strong></td>
                        <td>${escapeHtml(it.Dosage || 'As directed')}</td>
                        <td>${escapeHtml(it.Quantity)} units</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `
            : '<p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">No medicines listed.</p>';

          return `
            <div class="card" style="margin-bottom: 1.25rem;">
              <div class="card-header">
                <div>
                  <strong style="color: var(--text-main);">Prescription #${rx.PrescriptionID}</strong>
                  <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 0.5rem;">
                    by <strong>${escapeHtml(rx.Doctor)}</strong>
                  </span>
                </div>
                <div style="font-size: 0.825rem; color: var(--secondary); font-weight: 500;">
                  📅 ${formatDate(rx.Date)}
                </div>
              </div>
              <div class="card-body">
                ${rx.Notes ? `
                  <div style="margin-bottom: 0.75rem; background: #f8fafc; border-left: 3px solid var(--primary); padding: 0.6rem 0.8rem; font-size: 0.85rem;">
                    <strong>Doctor's Notes:</strong> ${escapeHtml(rx.Notes)}
                  </div>
                ` : ''}

                <div style="font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; color: var(--secondary);">
                  Prescribed Medicines
                </div>
                ${itemsTableHtml}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        showMessage('alertBox', 'error', 'Unable to fetch prescriptions: ' + err.message);
        container.innerHTML = '<p style="color: var(--error); text-align: center;">Error loading records.</p>';
      }
    }
  </script>
</body>
</html>
